<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scouting Futebol</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 10px;
}

button {
  width: 45%;
  padding: 15px;
  margin: 5px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

.green { background-color: #4CAF50; color: white; }
.red { background-color: #f44336; color: white; }
.blue { background-color: #2196F3; color: white; width: 90%; }

input {
  padding: 8px;
  width: 80%;
  margin: 5px;
}
</style>
</head>

<body>

<h2>📋 Dados do Jogo</h2>

<input type="text" id="nome" placeholder="Nome jogador"><br>
<input type="text" id="escalao" placeholder="Escalão"><br>
<input type="text" id="adversario" placeholder="Adversário"><br>
<input type="date" id="data"><br>

<h2>⚽ Ações</h2>

<button class="green" onclick="add('golo')">⚽ +</button>
<button class="red" onclick="removeStat('golo')">⚽ -</button>

<button class="green" onclick="add('assistencia')">🅰️ +</button>
<button class="red" onclick="removeStat('assistencia')">🅰️ -</button>

<button class="green" onclick="add('passeCerto')">✅ +</button>
<button class="red" onclick="removeStat('passeCerto')">❌ -</button>

<button class="blue" onclick="guardarJogo()">💾 Guardar Jogo</button>

<h2>📊 Estatísticas</h2>

<p>⚽ Golos: <span id="golos">0</span></p>
<p>🅰️ Assistências: <span id="assistencias">0</span></p>
<p>📈 % Passes: <span id="passes">0%</span></p>
<p>⭐ Nota: <span id="nota">0</span></p>

<h2>📚 Histórico</h2>
<div id="historico"></div>

<script>
let stats = {
  golo: 0,
  assistencia: 0,
  remate: 0,
  falhado: 0,
  passeCerto: 0,
  passeErrado: 0,
  recuperacao: 0,
  perda: 0
};

function add(tipo) {
  stats[tipo]++;
  update();
}

function update() {
  document.getElementById("golos").innerText = stats.golo;
  document.getElementById("assistencias").innerText = stats.assistencia;

  let totalPasses = stats.passeCerto + stats.passeErrado;
  let percentPasses = totalPasses ? Math.round((stats.passeCerto / totalPasses) * 100) : 0;

  document.getElementById("passes").innerText = percentPasses + "%";

  let nota = (stats.golo*1.5 + stats.assistencia*1 + stats.passeCerto*0.1 - stats.perda*0.3);
  nota = Math.max(0, Math.min(10, nota.toFixed(1)));

  document.getElementById("nota").innerText = nota;
}

function guardarJogo() {

  let jogo = {
    nome: document.getElementById("nome").value,
    escalao: document.getElementById("escalao").value,
    adversario: document.getElementById("adversario").value,
    data: document.getElementById("data").value,
    stats: {...stats}
  };

  let jogos = JSON.parse(localStorage.getItem("jogos")) || [];
  jogos.push(jogo);

  localStorage.setItem("jogos", JSON.stringify(jogos));

  mostrarHistorico();
  resetStats();
}

function mostrarHistorico() {
  let jogos = JSON.parse(localStorage.getItem("jogos")) || [];
  let html = "";

  jogos.forEach(j => {
    html += `
    <div style="border:1px solid #ccc;margin:10px;padding:10px;border-radius:10px;">
      <b>${j.nome}</b> (${j.escalao})<br>
      🆚 ${j.adversario}<br>
      📅 ${j.data}<br>
      ⚽ ${j.stats.golo} | 🅰️ ${j.stats.assistencia} | 📊 ${Math.round((j.stats.passeCerto/(j.stats.passeCerto+j.stats.passeErrado||1))*100)}%
    </div>
    `;
  });

  document.getElementById("historico").innerHTML = html;
}

function resetStats() {
  stats = {
    golo: 0,
    assistencia: 0,
    remate: 0,
    falhado: 0,
    passeCerto: 0,
    passeErrado: 0,
    recuperacao: 0,
    perda: 0
  };
  update();
}

mostrarHistorico();
</script>

</body>
</html>
