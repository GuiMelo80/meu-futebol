<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087452"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Meu Futebol</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#13251d;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px 15px 45px}header{padding:25px;border-radius:22px;background:linear-gradient(135deg,#075b41,#10a46c);color:#fff}h1{margin:0;font-size:2rem}header p{margin:6px 0 0;color:#dcffef}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.stat,section{background:#fff;border:1px solid #d6e4dc;border-radius:16px}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem;color:#087452}.stat small{color:#5e7066}section{padding:18px;margin-top:14px}h2{font-size:1.1rem;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:.82rem;font-weight:650;display:grid;gap:5px}.wide{grid-column:span 2}input{padding:10px;border:1px solid #b8c9c0;border-radius:9px;font:inherit;width:100%}button{background:#087452;color:#fff;border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#def5e8;color:#075b41;margin-left:8px}.accuracy{background:#def5e8;padding:13px;border-radius:12px}.accuracy b{font-size:1.4rem;color:#087452}.bar{height:8px;background:#b8d9c8;border-radius:20px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#087452}.game{display:flex;justify-content:space-between;gap:9px;border-top:1px solid #e0e9e4;padding:12px 0}.game:first-child{border:0}.game h3,.game p{margin:0}.game p{font-size:.82rem;color:#607167;margin-top:4px}.right{text-align:right;color:#087452;font-size:.88rem;font-weight:650}.delete{background:none;color:#a23d3d;padding:4px;font-size:.75rem}.empty{text-align:center;color:#607167;padding:18px}@media(max-width:500px){.stats{grid-template-columns:repeat(3,1fr)}.stat:last-child{grid-column:span 2}}
</style></head><body><main><header><h1>Meu Futebol</h1><p>Estatísticas da época, jogo a jogo.</p></header><div class="stats"><div class="stat"><b id="matches">0</b><small>Jogos</small></div><div class="stat"><b id="goals">0</b><small>Golos</small></div><div class="stat"><b id="assists">0</b><small>Assistências</small></div><div class="stat"><b id="dribbles">0</b><small>Dribles</small></div><div class="stat"><b id="passes">—</b><small>Passes certos</small></div></div><section><h2>Registar jogo</h2><form id="form" class="form"><label class="wide">Adversário<input id="opponent" required placeholder="Ex.: Sporting"></label><label>Data<input id="date" type="date" required></label><label>Resultado<input id="result" placeholder="Ex.: 3–1"></label><label>Golos<input id="goalsIn" type="number" min="0" value="0"></label><label>Assistências<input id="assistsIn" type="number" min="0" value="0"></label><label>Dribles certos<input id="dribblesIn" type="number" min="0" value="0"></label><label>Passes certos<input id="good" type="number" min="0" value="0"></label><label>Passes falhados<input id="bad" type="number" min="0" value="0"></label><div class="wide"><button>Guardar jogo</button><button type="reset" class="secondary">Limpar</button></div></form></section><section><h2>Precisão de passe</h2><div class="accuracy"><b id="accuracy">—</b> <span id="detail">Ainda sem passes registados</span><div class="bar"><i id="bar" style="width:0%"></i></div></div></section><section><h2>Histórico</h2><div id="list"></div></section></main><script>
const K='meu-futebol';let games=JSON.parse(localStorage.getItem(K)||'[]');const $=x=>document.getElementById(x),num=x=>+$(x).value||0;$('date').value=new Date().toISOString().slice(0,10);function esc(x){return x.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){let t=games.reduce((a,g)=>({goals:a.goals+g.goals,assists:a.assists+g.assists,dribbles:a.dribbles+g.dribbles,good:a.good+g.good,bad:a.bad+g.bad}),{goals:0,assists:0,dribbles:0,good:0,bad:0}),all=t.good+t.bad,p=all?Math.round(100*t.good/all):0;$('matches').textContent=games.length;$('goals').textContent=t.goals;$('assists').textContent=t.assists;$('dribbles').textContent=t.dribbles;$('passes').textContent=all?p+'%':'—';$('accuracy').textContent=all?p+'%':'—';$('detail').textContent=all?`${t.good} certos em ${all} tentados`:'Ainda sem passes registados';$('bar').style.width=p+'%';$('list').innerHTML=games.length?games.map((g,i)=>`<article class="game"><div><h3>${esc(g.opponent)} ${g.result?'· '+esc(g.result):''}</h3><p>${new Date(g.date+'T12:00').toLocaleDateString('pt-PT')}</p></div><div class="right">⚽ ${g.goals} · 🎯 ${g.assists} · 🏃 ${g.dribbles}<br><small>${g.good}/${g.good+g.bad} passes</small><br><button class="delete" onclick="del(${i})">Apagar</button></div></article>`).join(''):'<div class="empty">Ainda não há jogos registados.</div>'}function del(i){games.splice(i,1);save()}function save(){localStorage.setItem(K,JSON.stringify(games));render()}$('form').onsubmit=e=>{e.preventDefault();games.unshift({opponent:$('opponent').value.trim(),date:$('date').value,result:$('result').value.trim(),goals:num('goalsIn'),assists:num('assistsIn'),dribbles:num('dribblesIn'),good:num('good'),bad:num('bad')});e.target.reset();$('date').value=new Date().toISOString().slice(0,10);save()};render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
