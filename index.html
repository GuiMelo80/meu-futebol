<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scouting Futebol</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 10px;
}

.card {
  background: #f5f5f5;
  margin: 10px;
  padding: 20px;
  border-radius: 15px;
  font-size: 20px;
  touch-action: pan-y;
}

.green { background: #4CAF50; color: white; }
.red { background: #f44336; color: white; }

h2 { margin-top: 20px; }
</style>
</head>

<body>

<h2>⚽ Scouting</h2>

<div class="card green" ontouchstart="startTouch(event, 'golo')" ontouchend="endTouch(event, 'golo')">⚽ Golo</div>
<div class="card green" ontouchstart="startTouch(event, 'assistencia')" ontouchend="endTouch(event, 'assistencia')">🅰️ Assistência</div>
<div class="card green" ontouchstart="startTouch(event, 'passeCerto')" ontouchend="endTouch(event, 'passeCerto')">✅ Passe Certo</div>
<div class="card red" ontouchstart="startTouch(event, 'passeErrado')" ontouchend="endTouch(event, 'passeErrado')">❌ Passe Errado</div>

<h2>📊 Estatísticas</h2>

<p>⚽ Golos: <span id="golos">0</span></p>
<p>🅰️ Assistências: <span id="assistencias">0</span></p>
<p>📈 % Passes: <span id="passes">0%</span></p>

<script>
let stats = {
  golo: 0,
  assistencia: 0,
  passeCerto: 0,
  passeErrado: 0
};

let touchStartX = 0;

function startTouch(e, tipo) {
  touchStartX = e.changedTouches[0].screenX;
}

function endTouch(e, tipo) {
  let touchEndX = e.changedTouches[0].screenX;

  if (touchEndX < touchStartX - 50) {
    // deslizar esquerda = desfazer
    if (stats[tipo] > 0) stats[tipo]--;
  } else {
    // toque normal = adicionar
    stats[tipo]++;
  }

  update();
}

function update() {
  document.getElementById("golos").innerText = stats.golo;
  document.getElementById("assistencias").innerText = stats.assistencia;

  let total = stats.passeCerto + stats.passeErrado;
  let percent = total ? Math.round((stats.passeCerto / total) * 100) : 0;

  document.getElementById("passes").innerText = percent + "%";
}
</script>

</body>
</html>
